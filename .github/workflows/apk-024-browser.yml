name: APK-024 Browser Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/direct-model-comparison.tsx"
      - "src/components/image-cost-calculator.module.css"
      - "src/lib/saved-cost-scenarios.ts"
      - "e2e/apk-024-saved-scenarios.cjs"
      - ".github/workflows/apk-024-browser.yml"

permissions:
  contents: read

concurrency:
  group: apk-024-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/pickkit-next.log 2>&1 &
          echo $! > /tmp/pickkit-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/model-a-b-comparison > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pickkit-next.log
          exit 1
      - name: Run saved scenario browser flow
        run: node e2e/apk-024-saved-scenarios.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-024-browser-evidence
          path: |
            artifacts/apk-024/*.png
            /tmp/pickkit-next.log
          if-no-files-found: warn
          retention-days: 14
