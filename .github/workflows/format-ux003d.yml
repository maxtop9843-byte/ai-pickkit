name: Format UX-003D

on:
  push:
    branches:
      - ux-003d-purpose-home-dot-hero

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-003d-purpose-home-dot-hero
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/page.tsx src/app/home-discovery.css src/app/home-dot-hero.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/home-discovery.css src/app/home-dot-hero.css
          git commit -m "chore(UX-003D): apply repository formatting"
          git push origin HEAD:ux-003d-purpose-home-dot-hero