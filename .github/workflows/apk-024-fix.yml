name: APK-024 lint fix

on:
  push:
    branches:
      - agent/apk-024-saved-cost-scenarios
    paths:
      - .github/workflows/apk-024-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apk-024-saved-cost-scenarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace synchronous effect state update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/direct-model-comparison.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {
    setSavedScenarios(
      parseSavedCostScenarios(localStorage.getItem(SAVED_COST_SCENARIOS_KEY)),
    );
    setStorageReady(true);
  }, []);'''
          new = '''  useEffect(() => {
    const timer = window.setTimeout(() => {
      setSavedScenarios(
        parseSavedCostScenarios(localStorage.getItem(SAVED_COST_SCENARIOS_KEY)),
      );
      setStorageReady(true);
    }, 0);

    return () => window.clearTimeout(timer);
  }, []);'''
          if old not in text:
              raise SystemExit('target effect not found')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write src/components/direct-model-comparison.tsx
          rm .github/workflows/apk-024-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/direct-model-comparison.tsx .github/workflows/apk-024-fix.yml
          git commit -m "fix: load saved scenarios asynchronously"
          git push origin HEAD:agent/apk-024-saved-cost-scenarios
