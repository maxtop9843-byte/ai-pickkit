name: UX-001 Queue Format

on:
  pull_request:
    paths:
      - "TASK_QUEUE.md"
      - ".github/workflows/ux-001-check-diagnostic.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write TASK_QUEUE.md
      - uses: actions/upload-artifact@v4
        with:
          name: ux-001-formatted-queue
          path: TASK_QUEUE.md
          if-no-files-found: error
