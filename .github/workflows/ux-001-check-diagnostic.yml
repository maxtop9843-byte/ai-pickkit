name: UX-001 Check Diagnostic

on:
  pull_request:
    paths:
      - "src/app/page.tsx"
      - "src/app/home-discovery.css"
      - ".github/workflows/ux-001-check-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture checks
        shell: bash
        run: |
          set +e
          npm run format:check > format.txt 2>&1
          echo $? > format.exit
          npm run lint > lint.txt 2>&1
          echo $? > lint.exit
          npm run typecheck > typecheck.txt 2>&1
          echo $? > typecheck.exit
          npm run test > test.txt 2>&1
          echo $? > test.exit
          npm run build > build.txt 2>&1
          echo $? > build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ux-001-check-diagnostics
          path: |
            *.txt
            *.exit
          if-no-files-found: error
