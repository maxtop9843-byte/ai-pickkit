name: APK-025 Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/comparison-export-panel.tsx"
      - "src/components/comparison-export-panel.module.css"
      - "src/lib/comparison-export.ts"
      - "src/lib/comparison-export.test.ts"
      - "src/app/model-a-b-comparison/page.tsx"
      - ".github/workflows/apk-025-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        if: always()
        run: npm run lint
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Test
        if: always()
        run: npm run test
