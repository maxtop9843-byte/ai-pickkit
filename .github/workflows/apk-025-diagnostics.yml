name: APK-025 Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/comparison-export-panel.tsx"
      - "src/components/comparison-export-panel.module.css"
      - "src/lib/comparison-export.ts"
      - "src/lib/comparison-export.test.ts"
      - "src/app/model-a-b-comparison/page.tsx"
      - ".github/workflows/apk-025-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Prettier patch
        run: |
          npx prettier --write \
            .github/workflows/apk-025-diagnostics.yml \
            src/app/model-a-b-comparison/page.tsx \
            src/components/comparison-export-panel.module.css \
            src/components/comparison-export-panel.tsx \
            src/lib/comparison-export.test.ts \
            src/lib/comparison-export.ts
          git diff > prettier.patch
      - name: Capture test log
        run: npm run test > test.log 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: apk-025-diagnostics
          path: |
            prettier.patch
            test.log
          if-no-files-found: error
