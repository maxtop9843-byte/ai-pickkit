name: APK-012 Format

on:
  push:
    branches:
      - agent/apk-012-price-freshness

permissions:
  contents: write

concurrency:
  group: apk-012-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apk-012-price-freshness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "APK-012 format freshness audit"
          git push origin HEAD:agent/apk-012-price-freshness
