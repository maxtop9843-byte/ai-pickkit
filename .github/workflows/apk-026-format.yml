name: APK-026 Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate formatter patch
        run: |
          npm run format
          git diff > /tmp/apk-026-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: apk-026-format-patch
          path: /tmp/apk-026-format.patch
          retention-days: 1
