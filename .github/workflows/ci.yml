name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apk-024-saved-cost-scenarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix and restore CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/direct-model-comparison.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {
    setSavedScenarios(
      parseSavedCostScenarios(localStorage.getItem(SAVED_COST_SCENARIOS_KEY)),
    );
    setStorageReady(true);
  }, []);'''
          new = '''  useEffect(() => {
    const timer = window.setTimeout(() => {
      setSavedScenarios(
        parseSavedCostScenarios(localStorage.getItem(SAVED_COST_SCENARIOS_KEY)),
      );
      setStorageReady(true);
    }, 0);

    return () => window.clearTimeout(timer);
  }, []);'''
          if old not in text:
              raise SystemExit('target effect not found')
          path.write_text(text.replace(old, new))
          PY
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci
                - run: npm run check
                - run: npm run build
                - run: git diff --check
          YAML
          rm -f .github/workflows/apk-024-fix.yml
          npx prettier --write src/components/direct-model-comparison.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/direct-model-comparison.tsx .github/workflows/ci.yml .github/workflows/apk-024-fix.yml
          git commit -m "fix: load saved scenarios asynchronously"
          git push origin HEAD:agent/apk-024-saved-cost-scenarios
