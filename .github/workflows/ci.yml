name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prettier patch
        run: |
          npx prettier --write src/components/direct-model-comparison.tsx src/lib/direct-model-comparison.test.ts src/lib/direct-model-comparison.ts src/lib/project.test.ts
          git diff --binary > prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-patch
          path: prettier.patch
