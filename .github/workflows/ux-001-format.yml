name: UX-001 Format Diagnostic

on:
  pull_request:
    paths:
      - "src/app/page.tsx"
      - "src/app/home-discovery.css"
      - ".github/workflows/ux-001-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: ux-001-formatted-files
          path: |
            src/app/page.tsx
            src/app/home-discovery.css
          if-no-files-found: error
