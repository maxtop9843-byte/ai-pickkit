name: Format APK-024

on:
  push:
    branches:
      - agent/apk-024-saved-cost-scenarios

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apk-024-saved-cost-scenarios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/direct-model-comparison.tsx src/lib/saved-cost-scenarios.ts src/lib/saved-cost-scenarios.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/direct-model-comparison.tsx src/lib/saved-cost-scenarios.ts src/lib/saved-cost-scenarios.test.ts
          git commit -m "fix: format APK-024 files"
          git push origin HEAD:agent/apk-024-saved-cost-scenarios
